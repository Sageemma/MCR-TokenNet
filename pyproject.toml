[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcr-tokennet"
version = "0.3.1"
description = "MCR-TokenNet microscopy classification implementation"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<2", "Pillow>=10,<12", "scikit-learn>=1.5,<2", "PyYAML>=6,<7", "opencv-python>=4.9,<5"]

[project.optional-dependencies]
baselines = ["torchvision>=0.20", "timm>=1.0", "transformers>=4.44", "fastervit>=0.9.8"]

[tool.setuptools.packages.find]
include = ["mcr_tokennet*"]

